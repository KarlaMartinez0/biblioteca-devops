services:
  web:
    build: .
    container_name: app_biblioteca
    ports:
      - "8080:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=biblioteca_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres_password
      - PORT=5000
    depends_on:
      - db
    networks:
      - red_biblioteca

  db:
    image: postgres:15-alpine
    container_name: postgres_biblioteca
    environment:
      - POSTGRES_DB=biblioteca_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - red_biblioteca

networks:
  red_biblioteca:
    driver: bridge

volumes:
  pgdata:
    driver: local
