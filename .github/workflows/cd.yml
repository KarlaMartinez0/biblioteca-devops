name: CD - Construir y publicar imagen

on:
  push:
    branches: [ main ]

jobs:
  # Job 1: las mismas pruebas del CI. Si falla, el job 2 NO se ejecuta.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biblioteca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_NAME: biblioteca_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r app/requerimientos.txt

      - name: Crear tabla de libros en la base de datos de pruebas
        run: psql -h localhost -U postgres -d biblioteca_test -f db/init.sql
        env:
          PGPASSWORD: postgres

      - name: Ejecutar pruebas
        run: python -m pytest -v

  # Job 2: solo corre si "test" termino en verde
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Genera nombre de imagen y etiquetas. Convierte a minusculas
      # automaticamente (GHCR no acepta mayusculas, y el usuario es KarlaMartinez0).
      - name: Generar nombre y etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}