name: CI - Pruebas automaticas

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biblioteca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_NAME: biblioteca_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r app/requerimientos.txt

      - name: Crear tabla de libros en la base de datos de pruebas
        run: psql -h localhost -U postgres -d biblioteca_test -f db/init.sql
        env:
          PGPASSWORD: postgres

      - name: Ejecutar pruebas
        run: python -m pytest -v